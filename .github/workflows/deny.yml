name: cargo-deny

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --workspace
